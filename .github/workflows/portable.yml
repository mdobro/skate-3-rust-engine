name: Portable

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxext-dev \
            libxfixes-dev libxinerama-dev libxrender-dev libdrm-dev libgbm-dev libgl-dev libegl-dev libdbus-1-dev
      - run: cargo check --workspace --exclude skate-steam-relay
      - run: cargo test -p skate-core -p skate-data

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - run: cargo install cargo-ndk --locked
      - name: Build APK and unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
